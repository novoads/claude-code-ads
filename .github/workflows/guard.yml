name: guard

# The pack's first CI, and deliberately the smallest thing that could be one.
#
# Only checks that need no credentials run here. Most scripts in scripts/ hit
# the network and need a real NOVOADS_API_KEY, which a public repo's PR runners
# must not have: a fork PR would either see the secret or fail confusingly, and
# a red check nobody can fix is worse than no check. brand-context is the
# exception — it only ever touches a local markdown file, so its unit tests run
# here like any other test.
#
# What these catch, and why they are separate jobs rather than one:
#
#   no-mcp  — an MCP mention drifting back into the docs. This repo runs one
#             executable path (REST + NOVOADS_API_KEY), and the claims that
#             pointed at the connector rotted twice before anything was watching.
#
#   no-gag  — an instruction telling the agent what to HIDE from the user, as
#             opposed to what to do. Asking an agent for silence backfires: it
#             surfaces the request instead of complying, so the topic gets more
#             attention than saying nothing would have (2026-08-08). Separate
#             job because it is a separate failure with a separate fix, and a
#             combined one would report the wrong remedy for half its hits.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No un-allowlisted MCP mentions
        run: ./scripts/check-no-mcp.sh

  no-gag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No instructions to hide things from the user
        run: ./scripts/check-no-gag.sh

  #   brand-context — the field store every skill reads. Two of its cases are
  #             already regressions caught in review: a regex that swallowed a
  #             newline and made an empty template read as fully populated, and
  #             a label/field mapping that would silently read as unset forever
  #             if either side were renamed alone. Both are invisible at a
  #             glance and neither costs a credit to check.
  brand-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: brand-context.py unit tests
        run: ./scripts/test-brand-context.sh
      - name: rank-ads.py unit tests
        run: ./scripts/test-rank-ads.sh

  #   links     — a skill that tells the agent to read a file which is not there
  #             fails SILENTLY: the agent shrugs and proceeds without the rules
  #             that file carried. Promoting two skills from depth four to depth
  #             two broke ~30 links in one commit, including every entry in the
  #             Seedance prompt library.
  #
  #   frontmatter — the description is the router. Over 1024 chars it truncates,
  #             and the tail is where the "NOT for X" disambiguation lives, so a
  #             long one makes a skill steal its neighbour's sentences. A nested
  #             SKILL.md is never registered at all — the video cloner sat fully written
  #             with correct triggers that nothing could ever match.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every relative link resolves
        run: ./scripts/check-links.sh
      - name: Skill frontmatter is registered and within budget
        run: ./scripts/check-skill-frontmatter.sh
